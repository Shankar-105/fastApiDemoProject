global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Day 2 wiring: scrape FastAPI metrics once /metrics is added.
  # This target will show DOWN until Day 3 instrumentation is in place.
  - job_name: "fastapi-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
