global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "fastapi-api"
    static_configs:
      - targets: ["fastapi-social-vm.centralindia.cloudapp.azure.com:443"]
    scheme: https
    metrics_path: /metrics
