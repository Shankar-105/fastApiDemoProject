services: # all the current services
  api:
    build: . # builds the 'Dockerfile' and gets it from the root directory
    ports:
      - "8000:8000"  # mapping localhost:8000 to container's 8000
    depends_on:
      - db  # Starts DB first
      - redis  # Starts Redis first
      - rabbitmq  # Celery broker for background jobs
    volumes:
      - .:/code
    environment:
      - DATABASE_HOST=db  # here inside the containers the api and the db communincation is via this 'db'
      - REDIS_HOST=redis  # inside Docker, services talk to each other by service name
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: unless-stopped  # Auto-restart if it crashes

  db:
    image: postgres:16-alpine # official postgres image
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=iota143
      - POSTGRES_DB=fastApi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
      - rabbitmq
    volumes:
      - .:/code
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: unless-stopped

  celery_beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      - db
      - redis
      - rabbitmq
    volumes:
      - .:/code
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  flower:
    image: mher/flower:2.0.1
    command: celery --broker=amqp://guest:guest@rabbitmq:5672// --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
      - celery_worker
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
